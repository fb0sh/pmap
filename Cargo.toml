[package]
name = "pmap"
version = "1.0.0"
edition = "2024"
description = "A cross-platform TCP port scanner for discovering open ports on target hosts"
license = "MIT"
repository = "https://github.com/fb0sh/pmap"
homepage = "https://github.com/fb0sh/pmap"
keywords = ["port-scanner", "tcp", "network", "security", "scanning"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
